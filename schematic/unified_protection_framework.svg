<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Unified exchange-first protection framework for parallel FFT processors</title>
  <desc id="desc">The figure contrasts full TMR and direct buffered stage ECC with the proposed exchange-first mapping, then shows native MDF and exchanged SDF groups feeding a common two-check stage ECC core, with selective buffering or localized fallback for residual stages.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#34495e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0077bb"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#008f7a"/>
    </marker>
    <style>
      .panel { fill:#ffffff; stroke:#aab4bf; stroke-width:2; rx:14; }
      .panel-blue { fill:#f5faff; stroke:#82b8d8; stroke-width:2; rx:14; }
      .panel-green { fill:#f4fbf8; stroke:#82c7b9; stroke-width:2; rx:14; }
      .head { font-family:Arial, Helvetica, sans-serif; font-size:25px; font-weight:700; fill:#1f2d3d; }
      .subhead { font-family:Arial, Helvetica, sans-serif; font-size:20px; font-weight:700; fill:#1f2d3d; }
      .label { font-family:Arial, Helvetica, sans-serif; font-size:18px; fill:#273746; }
      .small { font-family:Arial, Helvetica, sans-serif; font-size:15px; fill:#425466; }
      .tiny { font-family:Arial, Helvetica, sans-serif; font-size:13px; fill:#425466; }
      .tag { font-family:Arial, Helvetica, sans-serif; font-size:13px; font-weight:700; }
      .box { fill:#ffffff; stroke:#667788; stroke-width:1.8; rx:9; }
      .box-grey { fill:#f4f6f7; stroke:#8d99a6; stroke-width:1.8; rx:9; }
      .box-red { fill:#fff4f1; stroke:#cc3311; stroke-width:1.8; rx:9; }
      .box-orange { fill:#fff8ef; stroke:#ee7733; stroke-width:1.8; rx:9; }
      .box-blue { fill:#edf7fd; stroke:#0077bb; stroke-width:2; rx:9; }
      .box-teal { fill:#eaf8f4; stroke:#008f7a; stroke-width:2; rx:9; }
      .box-purple { fill:#f6f2f8; stroke:#7a5195; stroke-width:1.8; rx:9; }
      .arrow { fill:none; stroke:#34495e; stroke-width:2.2; marker-end:url(#arrow); }
      .arrow-blue { fill:none; stroke:#0077bb; stroke-width:2.4; marker-end:url(#arrowBlue); }
      .arrow-teal { fill:none; stroke:#008f7a; stroke-width:2.4; marker-end:url(#arrowTeal); }
      .dash { fill:none; stroke:#7b8794; stroke-width:1.8; stroke-dasharray:7 6; marker-end:url(#arrow); }
      .divider { stroke:#d7dde3; stroke-width:1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>

  <!-- Panel A: design tension -->
  <rect class="panel" x="24" y="28" width="332" height="704"/>
  <rect x="24" y="28" width="332" height="48" rx="14" fill="#eef1f4"/>
  <text class="head" x="42" y="60">A  Design tension</text>

  <rect class="box-grey" x="55" y="100" width="270" height="62"/>
  <text class="subhead" x="190" y="126" text-anchor="middle">Existing parallel FFT</text>
  <text class="small" x="190" y="149" text-anchor="middle">P = 4 functional lanes</text>

  <path class="dash" d="M190 162 V188 H110 V207"/>
  <path class="dash" d="M190 162 V188 H271 V207"/>

  <rect class="box-red" x="43" y="207" width="142" height="170"/>
  <text class="subhead" x="114" y="234" text-anchor="middle" fill="#9d2b12">Full TMR</text>
  <rect x="59" y="252" width="74" height="30" rx="5" fill="#ffffff" stroke="#cc3311" stroke-width="1.5"/>
  <rect x="67" y="261" width="74" height="30" rx="5" fill="#ffffff" stroke="#cc3311" stroke-width="1.5"/>
  <rect x="75" y="270" width="74" height="30" rx="5" fill="#ffffff" stroke="#cc3311" stroke-width="1.5"/>
  <text class="tiny" x="104" y="290" text-anchor="middle">FFT x3</text>
  <circle cx="114" cy="321" r="16" fill="#ffffff" stroke="#cc3311" stroke-width="1.8"/>
  <text class="tiny" x="114" y="326" text-anchor="middle" font-weight="700">V</text>
  <text class="small" x="114" y="351" text-anchor="middle" fill="#9d2b12">High compute</text>
  <text class="tiny" x="114" y="369" text-anchor="middle">No alignment condition</text>

  <rect class="box-orange" x="198" y="207" width="142" height="170"/>
  <text class="small" x="269" y="228" text-anchor="middle" font-weight="700" fill="#b95418">Direct buffered</text>
  <text class="subhead" x="269" y="249" text-anchor="middle" fill="#b95418">stage ECC</text>
  <g transform="translate(224,260)">
    <rect x="0" y="0" width="72" height="22" rx="4" fill="#ffffff" stroke="#ee7733" stroke-width="1.4"/>
    <rect x="8" y="12" width="72" height="22" rx="4" fill="#ffffff" stroke="#ee7733" stroke-width="1.4"/>
    <rect x="16" y="24" width="72" height="22" rx="4" fill="#ffffff" stroke="#ee7733" stroke-width="1.4"/>
    <text class="tiny" x="44" y="40" text-anchor="middle">Buffer</text>
  </g>
  <path d="M269 310 V326" stroke="#ee7733" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="226" y="327" width="86" height="26" rx="5" fill="#ffffff" stroke="#ee7733" stroke-width="1.5"/>
  <text class="tiny" x="269" y="345" text-anchor="middle">Decoder</text>
  <text class="tiny" x="269" y="371" text-anchor="middle" fill="#b95418" font-weight="700">storage + latency</text>

  <line class="divider" x1="43" y1="404" x2="340" y2="404"/>
  <text class="small" x="190" y="432" text-anchor="middle" font-weight="700">Proposed design objective</text>
  <rect class="box-blue" x="55" y="452" width="270" height="104"/>
  <text class="subhead" x="190" y="479" text-anchor="middle" fill="#005c91">Reuse the existing</text>
  <text class="subhead" x="190" y="503" text-anchor="middle" fill="#005c91">functional parallelism</text>
  <text class="small" x="190" y="527" text-anchor="middle">Create common operators first</text>
  <text class="small" x="190" y="548" text-anchor="middle">Buffer only residual stages</text>

  <rect x="74" y="590" width="232" height="92" rx="9" fill="#f7fafc" stroke="#82909e" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text class="small" x="190" y="617" text-anchor="middle" font-weight="700">Avoid both extremes</text>
  <text class="tiny" x="190" y="643" text-anchor="middle">No complete check FFT copies</text>
  <text class="tiny" x="190" y="665" text-anchor="middle">No full-stage alignment buffers</text>

  <!-- Panel B: operator adaptation -->
  <rect class="panel-blue" x="390" y="28" width="528" height="704"/>
  <rect x="390" y="28" width="528" height="48" rx="14" fill="#e6f3fb"/>
  <text class="head" x="410" y="60">B  Exchange-first operator adaptation</text>

  <rect class="box-teal" x="420" y="105" width="210" height="82"/>
  <text class="subhead" x="525" y="134" text-anchor="middle">P-path MDF</text>
  <text class="small" x="525" y="160" text-anchor="middle">native-homogeneous</text>
  <rect x="535" y="169" width="82" height="20" rx="10" fill="#008f7a"/>
  <text class="tag" x="576" y="184" text-anchor="middle" fill="#ffffff">MATLAB ref.</text>

  <rect class="box-grey" x="676" y="105" width="210" height="82"/>
  <text class="subhead" x="781" y="134" text-anchor="middle">P-lane SDF</text>
  <text class="small" x="781" y="160" text-anchor="middle">heterogeneous operators</text>
  <rect x="805" y="169" width="68" height="20" rx="10" fill="#607586"/>
  <text class="tag" x="839" y="184" text-anchor="middle" fill="#ffffff">FPGA path</text>

  <rect class="box-teal" x="420" y="242" width="210" height="82"/>
  <text class="subhead" x="525" y="271" text-anchor="middle">Native common</text>
  <text class="small" x="525" y="297" text-anchor="middle">stage operators</text>
  <path class="arrow-teal" d="M525 187 V242"/>

  <rect class="box-blue" x="676" y="226" width="210" height="114"/>
  <text class="subhead" x="781" y="256" text-anchor="middle">Constrained twiddle</text>
  <text class="subhead" x="781" y="281" text-anchor="middle">exchange</text>
  <text class="tiny" x="781" y="307" text-anchor="middle">legal intervals + path consistency</text>
  <text class="tiny" x="781" y="327" text-anchor="middle">exact FFT equivalence</text>
  <path class="arrow-blue" d="M781 187 V226"/>

  <rect class="box-blue" x="548" y="374" width="218" height="82"/>
  <text class="subhead" x="657" y="404" text-anchor="middle">Homogeneous groups</text>
  <text class="small" x="657" y="430" text-anchor="middle">eligible for stage ECC</text>
  <path class="arrow-teal" d="M525 324 V350 H610 V374"/>
  <path class="arrow-blue" d="M781 340 V350 H704 V374"/>

  <rect class="box-orange" x="720" y="486" width="172" height="82"/>
  <text class="subhead" x="806" y="516" text-anchor="middle">Residual groups</text>
  <text class="small" x="806" y="542" text-anchor="middle">still heterogeneous</text>
  <path class="dash" d="M830 340 V486"/>

  <rect class="box" x="478" y="496" width="206" height="96"/>
  <text class="subhead" x="581" y="527" text-anchor="middle">Resource evaluator</text>
  <text class="small" x="581" y="553" text-anchor="middle">alignment span Aₛ</text>
  <text class="small" x="581" y="577" text-anchor="middle">buffer words Bₛ</text>
  <path class="arrow" d="M720 527 H684"/>

  <rect class="box-teal" x="426" y="632" width="202" height="66"/>
  <text class="subhead" x="527" y="660" text-anchor="middle">Selective buffer</text>
  <text class="tiny" x="527" y="683" text-anchor="middle">when resource-feasible</text>
  <rect class="box-purple" x="676" y="632" width="202" height="66"/>
  <text class="subhead" x="777" y="660" text-anchor="middle">Localized fallback</text>
  <text class="tiny" x="777" y="683" text-anchor="middle">otherwise</text>
  <path class="arrow-teal" d="M548 592 V610 H527 V632"/>
  <path class="arrow" d="M614 592 V610 H777 V632"/>

  <!-- Panel C: common correction and complete protection -->
  <rect class="panel-green" x="944" y="28" width="432" height="704"/>
  <rect x="944" y="28" width="432" height="48" rx="14" fill="#e5f5f0"/>
  <text class="head" x="964" y="60">C  Unified stage protection</text>

  <rect class="box-teal" x="978" y="103" width="364" height="270"/>
  <text class="subhead" x="1160" y="132" text-anchor="middle">Two-check [6,4,3] stage ECC core</text>

  <g transform="translate(1000,154)">
    <rect x="0" y="0" width="91" height="28" rx="5" fill="#ffffff" stroke="#0077bb" stroke-width="1.5"/>
    <rect x="0" y="36" width="91" height="28" rx="5" fill="#ffffff" stroke="#0077bb" stroke-width="1.5"/>
    <rect x="0" y="72" width="91" height="28" rx="5" fill="#ffffff" stroke="#0077bb" stroke-width="1.5"/>
    <rect x="0" y="108" width="91" height="28" rx="5" fill="#ffffff" stroke="#0077bb" stroke-width="1.5"/>
    <text class="tiny" x="45" y="19" text-anchor="middle">functional 1</text>
    <text class="tiny" x="45" y="55" text-anchor="middle">functional 2</text>
    <text class="tiny" x="45" y="91" text-anchor="middle">functional 3</text>
    <text class="tiny" x="45" y="127" text-anchor="middle">functional 4</text>
    <rect x="0" y="151" width="91" height="28" rx="5" fill="#e8f7f3" stroke="#008f7a" stroke-width="1.5"/>
    <rect x="0" y="187" width="91" height="28" rx="5" fill="#e8f7f3" stroke="#008f7a" stroke-width="1.5"/>
    <text class="tiny" x="45" y="170" text-anchor="middle">check p0</text>
    <text class="tiny" x="45" y="206" text-anchor="middle">check p1</text>
  </g>

  <rect x="1112" y="175" width="98" height="66" rx="8" fill="#ffffff" stroke="#008f7a" stroke-width="1.7"/>
  <text class="small" x="1161" y="202" text-anchor="middle" font-weight="700">Common</text>
  <text class="small" x="1161" y="226" text-anchor="middle">operator</text>
  <path class="arrow-teal" d="M1091 222 H1112"/>

  <rect x="1230" y="158" width="90" height="58" rx="8" fill="#ffffff" stroke="#008f7a" stroke-width="1.7"/>
  <text class="small" x="1275" y="183" text-anchor="middle" font-weight="700">Syndrome</text>
  <text class="tiny" x="1275" y="203" text-anchor="middle">s0, s1</text>
  <rect x="1230" y="238" width="90" height="58" rx="8" fill="#ffffff" stroke="#008f7a" stroke-width="1.7"/>
  <text class="small" x="1275" y="263" text-anchor="middle" font-weight="700">Corrector</text>
  <text class="tiny" x="1275" y="283" text-anchor="middle">in place</text>
  <path class="arrow-teal" d="M1210 208 H1230"/>
  <path class="arrow-teal" d="M1275 216 V238"/>
  <line x1="1215" y1="310" x2="1330" y2="310" stroke="#cc3311" stroke-width="3"/>
  <text class="tag" x="1272" y="329" text-anchor="middle" fill="#9d2b12">correct before forwarding</text>

  <path class="arrow-teal" d="M766 415 H930 V220 H978"/>
  <path class="arrow-teal" d="M426 665 H405 V415 H548"/>

  <rect class="box-purple" x="997" y="388" width="326" height="82"/>
  <text class="subhead" x="1160" y="418" text-anchor="middle">Localized residual protection</text>
  <text class="small" x="1160" y="445" text-anchor="middle">selected only for non-ECC stages</text>
  <path class="arrow" d="M878 665 H928 V429 H997"/>

  <circle cx="1160" cy="514" r="14" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <path d="M1149 514 H1171 M1160 503 V525" stroke="#34495e" stroke-width="2"/>
  <path class="arrow-teal" d="M1080 373 V514 H1146"/>
  <path class="arrow" d="M1240 470 V514 H1174"/>

  <rect class="box" x="990" y="548" width="340" height="112"/>
  <text class="subhead" x="1160" y="578" text-anchor="middle">Complete 10-stage protection map</text>
  <g transform="translate(1015,596)">
    <rect x="0" y="0" width="86" height="34" rx="6" fill="#e8f5fb" stroke="#0077bb" stroke-width="1.5"/>
    <rect x="92" y="0" width="86" height="34" rx="6" fill="#e8f7f3" stroke="#008f7a" stroke-width="1.5"/>
    <rect x="184" y="0" width="106" height="34" rx="6" fill="#f6f2f8" stroke="#7a5195" stroke-width="1.5"/>
    <text class="tiny" x="43" y="22" text-anchor="middle">exchange ECC</text>
    <text class="tiny" x="135" y="22" text-anchor="middle">buffered ECC</text>
    <text class="tiny" x="237" y="22" text-anchor="middle">fallback</text>
  </g>
  <text class="small" x="1160" y="650" text-anchor="middle" font-style="italic">hₛ + bₛ + fₛ = 1</text>
  <path class="arrow" d="M1160 528 V548"/>

  <rect x="1030" y="688" width="260" height="30" rx="15" fill="#1f566f"/>
  <text class="tag" x="1160" y="708" text-anchor="middle" fill="#ffffff">protected streaming FFT output</text>
  <path class="arrow" d="M1160 660 V688"/>

  <!-- Compact legend -->
  <g transform="translate(964,744)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#34495e" stroke-width="2"/>
    <text class="tiny" x="34" y="5">data / mapping flow</text>
    <line x1="177" y1="0" x2="205" y2="0" stroke="#7b8794" stroke-width="2" stroke-dasharray="6 5"/>
    <text class="tiny" x="211" y="5">alternative or residual path</text>
  </g>
</svg>
